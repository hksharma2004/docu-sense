name: Release

# Push a tag like v0.2.0 (matching pyproject.toml's version) to publish to PyPI and attach the
# wheel + Claude Desktop bundle (.mcpb) to a GitHub release.
#
# One-time setup on pypi.org: Account → Publishing → add a pending trusted publisher
#   project: docusense-mcp · owner/repo: this repo · workflow: release.yml · environment: pypi

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: tag matches pyproject version
        run: |
          V=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
          test "v$V" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != pyproject v$V"; exit 1; }
      - run: uv sync --locked
      - run: uv run pytest -q
      - run: uv build
      - run: uv run python scripts/build_mcpb.py
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/docusense.mcpb

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - run: rm -f dist/docusense.mcpb
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --generate-notes

  mcp-registry:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: server.json version matches tag
        run: |
          V=$(jq -r .version server.json)
          test "v$V" = "$GITHUB_REF_NAME" || { echo "server.json $V != tag $GITHUB_REF_NAME"; exit 1; }
      - name: wait for PyPI to serve the release
        run: |
          for i in $(seq 1 30); do
            curl -sf "https://pypi.org/pypi/docusense-mcp/${GITHUB_REF_NAME#v}/json" >/dev/null && exit 0
            sleep 10
          done
          exit 1
      - name: install mcp-publisher
        run: |
          curl -sL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish
