services:
  db:
    image: pgvector/pgvector:pg17
    container_name: docusense-db
    environment:
      POSTGRES_USER: docusense
      POSTGRES_PASSWORD: docusense
      POSTGRES_DB: docusense
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docusense"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
