[project]
name = "docusense-mcp"
version = "0.1.0"
description = "A verifiable and version-native document layer for AI agents (MCP)"
authors = [
    { name = "hksharma2004", email = "hksharma2004@users.noreply.github.com" }
]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "pymupdf>=1.24",
    "markdown-it-py>=3.0",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "typer>=0.12",
    "httpx>=0.27",
    "rich>=13.7",
    "mcp>=1.10",
    "bm25s>=0.2",
    "pystemmer>=2.2",
    "fastembed>=0.4",
    "numpy>=1.26",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
# Postgres + pgvector backend (team / hosted). The default backend is embedded SQLite.
postgres = [
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3",
]

# Anthropic (Claude) as the optional LLM provider for extraction fallback / contradiction judging.
anthropic = ["anthropic>=1.0"]

[project.scripts]
docusense = "docusense.cli:main"
docusense-mcp = "docusense.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "psycopg[binary,pool]>=3.2", "pgvector>=0.3", "anthropic>=1.0"]

[tool.uv.build-backend]
module-name = "docusense"

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
